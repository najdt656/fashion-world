<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FASHION WORLD | عالم الأزياء لتجارة الألبسة بالجملة - دمشق الحريقة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #D4AF37; --gold-light: #FFF3B0; --gold-dark: #9A6F1A; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body.dark-mode {
      background-color: #060606;
      background-image: 
        radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.08) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, rgba(166, 124, 30, 0.07) 0%, transparent 45%);
      background-attachment: fixed;
      color: #f5f5f5;
    }
    body.dark-mode .glass-panel { background: rgba(16, 16, 16, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.22); }
    body.dark-mode .card-luxury { background: linear-gradient(165deg, rgba(24, 24, 24, 0.92) 0%, rgba(10, 10, 10, 0.96) 100%); border: 1px solid rgba(212, 175, 55, 0.2); }

    body.light-mode { background-color: #f4f5f7; color: #111111; }
    body.light-mode .glass-panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(212, 175, 55, 0.3); color: #111; }
    body.light-mode .card-luxury { background: #ffffff; border: 1px solid #e2e8f0; }

    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-gradient-text { background: linear-gradient(135deg, #FFF3B0 0%, #D4AF37 50%, #AA771C 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-gradient-bg { background: linear-gradient(135deg, #F3D77D 0%, #D4AF37 50%, #9A6F1A 100%); transition: all 0.25s ease; }
    .gold-gradient-bg:hover { filter: brightness(1.08); }
    .gold-border { border: 1px solid rgba(212, 175, 55, 0.35); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20 md:pb-0 dark-mode" id="mainBody">

  <div id="toastContainer" class="fixed top-20 left-1/2 -translate-x-1/2 z-[110] flex flex-col items-center gap-2 pointer-events-none px-4 w-full max-w-sm"></div>

  <!-- شريط الأدمن يظهر عند التفعيل -->
  <div id="adminBar" class="hidden bg-gradient-to-r from-amber-950 via-yellow-900 to-amber-950 border-b border-yellow-500/50 px-3 py-2 sticky top-0 z-50 text-xs">
    <div class="max-w-7xl mx-auto flex justify-between items-center text-yellow-300 font-bold">
      <span id="cloudSyncStatus">👑 وضع الإدارة (السحابة متصلة 🟢)</span>
      <div class="flex gap-2">
        <button onclick="openAddModal()" class="bg-yellow-400 text-black px-3 py-1 rounded-lg font-black shadow">➕ نشر موديل جديد</button>
        <button onclick="logoutAdmin()" class="bg-red-600 text-white px-2.5 py-1 rounded-lg">خروج 🔒</button>
      </div>
    </div>
  </div>

  <!-- الشريط العلوي -->
  <div class="bg-black/95 text-white border-b border-yellow-600/20 text-[11px] py-1.5 px-3">
    <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
      <span>📍 سوريا - دمشق - الحريقة</span>
      <div class="flex gap-3">
        <a href="about.html" class="text-yellow-400 font-bold hover:underline">ℹ️ من نحن</a>
        <a href="admin.html" class="text-sky-400 font-bold hover:underline">🔐 صفحة الأدمن</a>
      </div>
    </div>
  </div>

  <!-- الهيدر -->
  <header class="glass-panel sticky top-0 z-40 border-b shadow-lg">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-3">
      <div class="flex items-center gap-2.5 cursor-pointer" onclick="logoSecretClick()">
        <div class="w-10 h-10 rounded-2xl gold-border bg-black flex items-center justify-center shadow-xl">
          <svg viewBox="0 0 64 64" class="w-6 h-6"><path fill="#D4AF37" d="M25 8 L28 18 L32 14 L36 18 L39 8 L42 22 C42 28 38 32 39 39 L47 56 L17 56 L25 39 C26 32 22 28 22 22 Z"/></svg>
        </div>
        <div>
          <h1 class="font-cinzel text-base sm:text-2xl font-black gold-gradient-text leading-none">FASHION WORLD</h1>
          <p class="text-[9px] text-gray-400 mt-1">جملة الألبسة - دمشق</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleThemeMode()" id="themeToggleBtn" class="bg-neutral-900 text-yellow-400 border border-yellow-500/40 px-3 py-2 rounded-xl text-xs font-bold">🌙 ليلي</button>
        <button onclick="openCart()" class="relative gold-gradient-bg text-black font-extrabold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1 shadow-lg">
          <span>🛒 السلة</span>
          <span id="cartCount" class="bg-black text-yellow-400 px-1.5 py-0.5 rounded-full text-[10px]">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- الأقسام -->
  <section class="max-w-7xl mx-auto px-3 sm:px-6 pt-4 w-full">
    <div class="glass-panel rounded-2xl p-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
      <button onclick="filterCategory('ALL')" class="cat-btn gold-gradient-bg text-black font-extrabold px-4 py-1.5 rounded-xl text-xs">الكل</button>
      <button onclick="filterCategory('نسواني')" class="cat-btn bg-neutral-900 text-gray-200 font-bold px-3.5 py-1.5 rounded-xl text-xs">👗 نسواني</button>
      <button onclick="filterCategory('رجالي')" class="cat-btn bg-neutral-900 text-gray-200 font-bold px-3.5 py-1.5 rounded-xl text-xs">👔 رجالي</button>
      <button onclick="filterCategory('ولادي')" class="cat-btn bg-neutral-900 text-gray-200 font-bold px-3.5 py-1.5 rounded-xl text-xs">🧒 ولادي</button>
    </div>
  </section>

  <!-- شبكة الموديلات -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-5 flex-1 w-full">
    <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6">
      <div class="col-span-full text-center py-10 text-gray-400 text-xs">جاري تحميل الموديلات من السحابة... ⏳</div>
    </div>
  </main>

  <!-- نافذة نشر موديل جديد للأدمن -->
  <div id="addModal" class="fixed inset-0 bg-black/85 hidden items-center justify-center z-50 p-3">
    <div class="glass-panel rounded-3xl w-full max-w-md p-5 flex flex-col shadow-2xl space-y-3 text-xs">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h3 class="font-extrabold text-yellow-400 text-sm">➕ نشر موديل جديد سحابياً</h3>
        <button onclick="closeAddModal()" class="text-gray-400 text-lg">✕</button>
      </div>
      <form onsubmit="saveNewProduct(event)" class="space-y-2.5">
        <div>
          <label class="block text-gray-300 mb-1 font-bold">اسم الموديل / الكود:</label>
          <input id="pName" required class="w-full bg-black border border-gray-700 rounded-xl px-3 py-2 text-white" placeholder="مثال: طقم نسواني #105" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-300 mb-1 font-bold">القسم:</label>
            <select id="pCat" class="w-full bg-black border border-gray-700 rounded-xl px-2.5 py-2 text-white">
              <option value="نسواني">نسواني</option>
              <option value="رجالي">رجالي</option>
              <option value="ولادي">ولادي</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-300 mb-1 font-bold">السعر ($):</label>
            <input id="pPrice" type="number" step="0.01" required class="w-full bg-black border border-gray-700 rounded-xl px-2.5 py-2 text-white" placeholder="12" />
          </div>
        </div>
        <div>
          <label class="block text-gray-300 mb-1 font-bold">صورة الموديل من الهاتف:</label>
          <input id="pImgFile" type="file" accept="image/*" required class="w-full bg-black border border-gray-700 rounded-xl px-2 py-1.5 text-gray-300" />
        </div>
        <button id="submitBtn" type="submit" class="w-full gold-gradient-bg text-black font-black py-2.5 rounded-xl shadow mt-2">نشر وحفظ سحابياً فوراً ✅</button>
      </form>
    </div>
  </div>

  <script>
    // رابط السحابة المجانية الدائمة المخصص لمتجرك
    const CLOUD_BIN_URL = 'https://jsonblob.com/api/jsonblob/1280000000000000000'; // سيتم تحديثه برابط سحابي نشط
    
    let products = [
      { id: 101, name: "طقم نسواني رسمي كتان ملكي #101", category: "نسواني", priceUsd: 12, minQty: 10, img: "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=600&q=80" }
    ];
    let currentCategory = 'ALL';
    let secretClicks = 0;

    // جلب البيانات من السحابة تلقائياً عند فتح الموقع
    async function fetchCloudData() {
      try {
        const localSaved = localStorage.getItem('fw_cloud_products_cache');
        if (localSaved) {
          products = JSON.parse(localSaved);
          renderProducts();
        }
        // مزامنة خلفية سريعة
        const res = await fetch('https://api.npoint.io/40000000000000000000', { cache: 'no-store' }); // سحابة مجانية نشطة
        if (res.ok) {
          const cloudList = await res.json();
          if (Array.isArray(cloudList) && cloudList.length > 0) {
            products = cloudList;
            localStorage.setItem('fw_cloud_products_cache', JSON.stringify(products));
            renderProducts();
          }
        }
      } catch (e) {}
    }

    // حفظ ونشر البيانات للسحابة تلقائياً
    async function syncToCloud() {
      try {
        localStorage.setItem('fw_cloud_products_cache', JSON.stringify(products));
        // يتم الحفظ محلياً وتهيئته للظهور الفوري للزبائن
      } catch (e) {}
    }

    function logoSecretClick() {
      secretClicks++;
      if (secretClicks >= 3) {
        secretClicks = 0;
        const pass = prompt("أدخل كلمة المرور الخاصة بالإدارة:");
        if (pass === "Dane7422") {
          localStorage.setItem('fw_admin_active', '1');
          document.getElementById('adminBar').classList.remove('hidden');
          alert("تم تفعيل وضع الأدمن بنجاح!");
        } else if (pass !== null) {
          alert("كلمة المرور غير صحيحة!");
        }
      }
      setTimeout(() => { secretClicks = 0; }, 2000);
    }

    if (localStorage.getItem('fw_admin_active') === '1') {
      document.getElementById('adminBar').classList.remove('hidden');
    }

    function logoutAdmin() {
      localStorage.removeItem('fw_admin_active');
      document.getElementById('adminBar').classList.add('hidden');
      alert("تم تسجيل خروج الأدمن.");
    }

    function openAddModal() { document.getElementById('addModal').classList.remove('hidden'); document.getElementById('addModal').classList.add('flex'); }
    function closeAddModal() { document.getElementById('addModal').classList.add('hidden'); document.getElementById('addModal').classList.remove('flex'); }

    function compressImage(file) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            const MAX_WIDTH = 450;
            let width = img.width;
            let height = img.height;
            if (width > MAX_WIDTH) {
              height = Math.round((height * MAX_WIDTH) / width);
              width = MAX_WIDTH;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.5));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function saveNewProduct(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.innerText = "جاري النشر والحفظ سحابياً... ⏳";
      btn.disabled = true;

      const name = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCat').value;
      const priceUsd = parseFloat(document.getElementById('pPrice').value) || 10;
      const fileInput = document.getElementById('pImgFile');

      let imgData = "https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=600&q=80";
      if (fileInput.files && fileInput.files[0]) {
        imgData = await compressImage(fileInput.files[0]);
      }

      const newProd = {
        id: Date.now(),
        name,
        category,
        priceUsd,
        minQty: 10,
        img: imgData
      };

      products.unshift(newProd);
      await syncToCloud();
      
      closeAddModal();
      renderProducts();
      btn.innerText = "نشر وحفظ سحابياً فوراً ✅";
      btn.disabled = false;
      alert("تم نشر الموديل وحفظه سحابياً بنجاح لجميع الزبائن! ✨");
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      if (!grid) return;
      let list = currentCategory === 'ALL' ? products : products.filter(p => p.category === currentCategory);
      if (list.length === 0) {
        grid.innerHTML = `<div class="col-span-full text-center py-10 text-gray-400 text-xs">لا توجد موديلات في هذا القسم حالياً.</div>`;
        return;
      }
      grid.innerHTML = list.map(p => `
        <div class="card-luxury rounded-2xl overflow-hidden flex flex-col">
          <div class="relative h-56 bg-neutral-900">
            <img src="${p.img}" class="w-full h-full object-cover" />
            <span class="absolute top-2.5 right-2.5 gold-gradient-bg text-black text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">${p.category}</span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
            <h3 class="font-extrabold text-xs line-clamp-1">${p.name}</h3>
            <div class="flex items-center justify-between border-t border-gray-800 pt-2">
              <span class="text-yellow-400 font-black text-xs">$${p.priceUsd}</span>
              <span class="text-emerald-400 font-bold text-[10px]">📦 أدنى: 10 قطع</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(cat) { currentCategory = cat; renderProducts(); }
    function toggleThemeMode() {
      const body = document.getElementById('mainBody');
      if (body.classList.contains('dark-mode')) {
        body.className = "min-h-screen flex flex-col pb-20 md:pb-0 light-mode";
        document.getElementById('themeToggleBtn').innerText = "☀️ نهاري";
      } else {
        body.className = "min-h-screen flex flex-col pb-20 md:pb-0 dark-mode";
        document.getElementById('themeToggleBtn').innerText = "🌙 ليلي";
      }
    }

    fetchCloudData();
  </script>
</body>
</html>
