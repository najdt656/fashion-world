<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark-mode" id="htmlRoot">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>FASHION WORLD | عالم الأزياء لتجارة الألبسة بالجملة - دمشق الحريقة</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=Cinzel:wght@700;900&display=swap" rel="stylesheet">
  <style>
    :root { --gold: #D4AF37; --gold-light: #FFF3B0; --gold-dark: #9A6F1A; }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body.dark-mode {
      font-family: 'Cairo', sans-serif;
      background-color: #060606;
      background-image: radial-gradient(circle at 15% 15%, rgba(212, 175, 55, 0.08) 0%, transparent 45%);
      color: #f5f5f5;
    }
    body.dark-mode .glass-panel { background: rgba(16, 16, 16, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.22); }
    body.dark-mode .card-luxury { background: linear-gradient(165deg, rgba(24, 24, 24, 0.92) 0%, rgba(10, 10, 10, 0.96) 100%); border: 1px solid rgba(212, 175, 55, 0.2); }

    body.light-mode {
      font-family: 'Cairo', sans-serif;
      background-color: #f4f5f7;
      color: #111111;
    }
    body.light-mode .glass-panel { background: rgba(255, 255, 255, 0.9); border: 1px solid rgba(212, 175, 55, 0.3); color: #111; }
    body.light-mode .card-luxury { background: #ffffff; border: 1px solid #e2e8f0; }

    .font-cinzel { font-family: 'Cinzel', serif; }
    .gold-gradient-text { background: linear-gradient(135deg, #FFF3B0 0%, #D4AF37 50%, #AA771C 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .gold-gradient-bg { background: linear-gradient(135deg, #F3D77D 0%, #D4AF37 50%, #9A6F1A 100%); transition: all 0.25s ease; }
    .gold-gradient-bg:hover { filter: brightness(1.08); }
    .gold-border { border: 1px solid rgba(212, 175, 55, 0.35); }
    .watermark-logo { position: absolute; top: 10px; left: 10px; opacity: 0.88; pointer-events: none; z-index: 10; background: rgba(0, 0, 0, 0.65); padding: 3px 8px; border-radius: 8px; border: 1px solid rgba(212, 175, 55, 0.45); backdrop-filter: blur(4px); display: flex; align-items: center; gap: 4px; }
    .no-scrollbar::-webkit-scrollbar { display: none; }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-20 md:pb-0 dark-mode" id="mainBody">

  <div id="toastContainer" class="fixed top-20 left-1/2 -translate-x-1/2 z-[110] flex flex-col items-center gap-2 pointer-events-none px-4 w-full max-w-sm"></div>

  <!-- لوحة الأدمن المخفية تماماً عن الزبائن (تظهر فقط عند تسجيل الدخول عبر Firebase) -->
  <div id="adminBar" class="hidden bg-gradient-to-r from-amber-950 via-yellow-900 to-amber-950 border-b border-yellow-500/50 px-3 py-2.5 sticky top-0 z-[60] text-xs shadow-xl">
    <div class="max-w-7xl mx-auto flex justify-between items-center text-yellow-300 font-bold">
      <span>👑 لوحة تحكم الأدمن (خاصة بك وحدك 🟢)</span>
      <div class="flex gap-2">
        <button onclick="openAddModal()" class="bg-yellow-400 text-black px-3 py-1 rounded-lg font-black shadow">➕ نشر موديل جديد</button>
        <button onclick="logoutAdminFirebase()" class="bg-red-600 text-white px-2.5 py-1 rounded-lg">خروج 🔒</button>
      </div>
    </div>
  </div>

  <!-- الهيدر العلوي -->
  <header class="glass-panel sticky top-0 z-50 border-b border-yellow-500/25 shadow-lg">
    <div class="max-w-7xl mx-auto px-3 sm:px-6 py-3 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2.5 cursor-pointer select-none" onclick="window.location.href='index.html'">
        <div class="w-10 h-10 rounded-2xl gold-border bg-black flex items-center justify-center shadow-xl">
          <svg viewBox="0 0 64 64" class="w-6 h-6"><path fill="#D4AF37" d="M25 8 L28 18 L32 14 L36 18 L39 8 L42 22 C42 28 38 32 39 39 L47 56 L17 56 L25 39 C26 32 22 28 22 22 Z"/></svg>
        </div>
        <div>
          <h1 class="font-cinzel text-base sm:text-2xl font-black gold-gradient-text leading-none">FASHION WORLD</h1>
          <p class="text-[9px] text-gray-400 mt-1">جملة الألبسة - دمشق</p>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button onclick="toggleThemeMode()" id="themeToggleBtn" class="bg-neutral-900 text-yellow-400 border border-yellow-500/40 px-3 py-2 rounded-xl text-xs font-bold shadow">🌙 ليلي</button>
        <select id="currencySelector" onchange="setCurrencyMode(this.value)" class="bg-neutral-900 text-yellow-400 border border-yellow-500/40 rounded-xl px-2.5 py-2 text-xs font-extrabold focus:outline-none cursor-pointer">
          <option value="BOTH">💵 $ + ل.س</option>
          <option value="USD">💵 دولار ($)</option>
          <option value="SYP">🇸🇾 ليرة (ل.س)</option>
        </select>
        <button onclick="openCart()" class="relative gold-gradient-bg text-black font-extrabold px-3.5 py-2 rounded-xl text-xs flex items-center gap-1 shadow-lg">
          <span>🛒 السلة</span>
          <span id="cartCount" class="bg-black text-yellow-400 px-1.5 py-0.5 rounded-full text-[10px] font-black">0</span>
        </button>
      </div>
    </div>
  </header>

  <!-- البحث والأقسام -->
  <section class="max-w-7xl mx-auto px-3 sm:px-6 pt-4 w-full space-y-2.5">
    <div class="glass-panel rounded-2xl p-2.5 flex items-center gap-2">
      <div class="relative flex-1 flex items-center">
        <span class="absolute right-3 text-yellow-400 text-sm">🔍</span>
        <input id="searchInput" type="text" oninput="handleSearch(this.value)" placeholder="ابحث عن اسم الموديل أو الكود..." class="w-full bg-black/80 border border-yellow-500/30 rounded-xl pr-9 pl-8 py-2 text-xs text-white focus:outline-none" />
      </div>
    </div>
    <div class="glass-panel rounded-2xl p-2 flex items-center gap-2 overflow-x-auto no-scrollbar">
      <button onclick="filterCategory('ALL')" class="cat-btn gold-gradient-bg text-black font-extrabold px-4 py-1.5 rounded-xl text-xs">الكل</button>
      <button onclick="filterCategory('نسواني')" class="cat-btn bg-neutral-900 text-gray-200 font-bold px-3.5 py-1.5 rounded-xl text-xs">👗 نسواني</button>
      <button onclick="filterCategory('رجالي')" class="cat-btn bg-neutral-900 text-gray-200 font-bold px-3.5 py-1.5 rounded-xl text-xs">👔 رجالي</button>
      <button onclick="filterCategory('ولادي')" class="cat-btn bg-neutral-900 text-gray-200 font-bold px-3.5 py-1.5 rounded-xl text-xs">🧒 ولادي</button>
      <button onclick="filterCategory('ب.ب')" class="cat-btn bg-neutral-900 text-gray-200 font-bold px-3.5 py-1.5 rounded-xl text-xs">👶 ب.ب</button>
    </div>
  </section>

  <!-- شبكة الموديلات -->
  <main class="max-w-7xl mx-auto px-3 sm:px-6 py-5 flex-1 w-full">
    <div id="productsGrid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-4 gap-3 sm:gap-6"></div>
  </main>

  <!-- نافذة تفاصيل الموديل (مع التقييم والتعليقات والإعجابات) -->
  <div id="productModal" class="fixed inset-0 bg-black/90 backdrop-blur-sm hidden items-center justify-center z-50 p-3">
    <div class="glass-panel rounded-3xl w-full max-w-2xl max-h-[90vh] p-4 flex flex-col shadow-2xl overflow-hidden text-xs">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2 mb-2">
        <h3 id="modalTitle" class="font-extrabold text-yellow-400 text-sm truncate">تفاصيل الموديل</h3>
        <button onclick="closeProductModal()" class="text-gray-400 text-lg">✕</button>
      </div>
      <div class="overflow-y-auto flex-1 space-y-3">
        <div class="relative h-60 rounded-xl overflow-hidden bg-black border border-gray-800">
          <img id="modalMainImg" src="" class="w-full h-full object-cover" />
          <div class="watermark-logo"><span class="text-[9px] font-cinzel font-bold gold-gradient-text">FASHION WORLD</span></div>
        </div>
        <div class="flex justify-between items-center bg-black/60 p-2.5 rounded-xl border border-gray-800">
          <span id="modalViews" class="text-gray-300 font-bold">👁️ 0 مشاهدة</span>
          <button id="modalLikeBtn" onclick="toggleLikeCurrent()" class="bg-neutral-800 text-red-400 font-bold px-3 py-1 rounded-lg">🤍 إعجاب (0)</button>
        </div>
        <p id="modalPack" class="text-gray-200 font-bold"></p>
        <div id="modalPriceContainer" class="flex justify-between border-t border-gray-800 pt-2"></div>
        
        <!-- التقييم بالنجوم -->
        <div class="flex items-center justify-between bg-black/60 p-3 rounded-xl border border-gray-800">
          <span class="text-yellow-300 font-bold">تقييم الموديل:</span>
          <div id="modalStarsContainer" class="flex gap-1 text-xl cursor-pointer"></div>
        </div>

        <!-- الكمية -->
        <div class="bg-black/60 p-3 rounded-xl border border-gray-800 space-y-2">
          <div class="flex justify-between items-center">
            <span class="text-yellow-300 font-bold">حدد الكمية:</span>
            <span id="modalMinNotice" class="text-gray-400 text-[10px]"></span>
          </div>
          <div class="flex items-center justify-center gap-2">
            <button onclick="adjustModalQty(-1)" class="bg-neutral-800 text-white w-8 h-8 rounded-lg font-bold">-</button>
            <input id="modalQtyInput" type="number" min="1" value="10" class="w-16 bg-black text-center text-yellow-400 font-black rounded-lg py-1" />
            <button onclick="adjustModalQty(1)" class="bg-neutral-800 text-white w-8 h-8 rounded-lg font-bold">+</button>
          </div>
        </div>

        <!-- قسم التعليقات المباشرة مع صلاحية حذفها للأدمن -->
        <div class="bg-black/70 p-3 rounded-xl border border-gray-800 space-y-2">
          <p class="font-bold text-yellow-400">💬 تعليقات التجار:</p>
          <div id="commentsList" class="space-y-1.5 max-h-28 overflow-y-auto"></div>
          <div class="flex gap-1.5 pt-1">
            <input id="commentAuthor" class="w-1/3 bg-black border border-gray-700 rounded-xl px-2 py-1.5 text-white" placeholder="اسمك..." />
            <input id="commentText" class="flex-1 bg-black border border-gray-700 rounded-xl px-2 py-1.5 text-white" placeholder="اكتب تعليقك..." />
            <button onclick="addComment()" class="gold-gradient-bg text-black font-extrabold px-3 py-1.5 rounded-xl">إرسال</button>
          </div>
        </div>
      </div>
      <div class="flex gap-2 pt-2 border-t border-gray-800 mt-2">
        <button onclick="addCustomQtyToCart()" class="flex-1 gold-gradient-bg text-black font-extrabold py-2.5 rounded-xl">🛒 أضف إلى السلة</button>
        <button onclick="closeProductModal()" class="bg-neutral-800 text-white px-4 py-2.5 rounded-xl">إغلاق</button>
      </div>
    </div>
  </div>

  <!-- نافذة نشر أو تعديل موديل للأدمن -->
  <div id="addModal" class="fixed inset-0 bg-black/85 hidden items-center justify-center z-50 p-3">
    <div class="glass-panel rounded-3xl w-full max-w-md p-5 flex flex-col shadow-2xl space-y-3 text-xs">
      <div class="flex justify-between items-center border-b border-gray-800 pb-2">
        <h3 id="addModalTitle" class="font-extrabold text-yellow-400 text-sm">➕ نشر موديل جديد</h3>
        <button onclick="closeAddModal()" class="text-gray-400 text-lg">✕</button>
      </div>
      <form onsubmit="saveNewProduct(event)" class="space-y-2.5">
        <input type="hidden" id="editProductId" value="" />
        <div>
          <label class="block text-gray-300 mb-1 font-bold">اسم الموديل / الكود:</label>
          <input id="pName" required class="w-full bg-black border border-gray-700 rounded-xl px-3 py-2 text-white" placeholder="مثال: طقم نسواني #105" />
        </div>
        <div class="grid grid-cols-2 gap-2">
          <div>
            <label class="block text-gray-300 mb-1 font-bold">القسم:</label>
            <select id="pCat" class="w-full bg-black border border-gray-700 rounded-xl px-2.5 py-2 text-white">
              <option value="نسواني">نسواني</option>
              <option value="رجالي">رجالي</option>
              <option value="ولادي">ولادي</option>
              <option value="ب.ب">ب.ب</option>
            </select>
          </div>
          <div>
            <label class="block text-gray-300 mb-1 font-bold">السعر ($):</label>
            <input id="pPrice" type="number" step="0.01" required class="w-full bg-black border border-gray-700 rounded-xl px-2.5 py-2 text-white" placeholder="12" />
          </div>
        </div>
        <div>
          <label class="block text-gray-300 mb-1 font-bold">صورة الموديل من الهاتف:</label>
          <input id="pImgFile" type="file" accept="image/*" class="w-full bg-black border border-gray-700 rounded-xl px-2 py-1.5 text-gray-300" />
        </div>
        <button type="submit" class="w-full gold-gradient-bg text-black font-black py-2.5 rounded-xl shadow mt-2">حفظ ونشر سحابياً ✅</button>
      </form>
    </div>
  </div>

  <!-- نافذة سلة الشراء -->
  <div id="cartModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm hidden items-end sm:items-center justify-center z-50 p-0 sm:p-4">
    <div class="glass-panel rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[88vh] p-5 flex flex-col shadow-2xl overflow-hidden">
      <div class="flex justify-between items-center border-b border-gray-800 pb-3 mb-3">
        <h3 class="font-extrabold text-yellow-400 text-sm sm:text-base">🛒 سلة طلبات الجملة</h3>
        <button onclick="closeCart()" class="bg-neutral-800 text-gray-300 w-8 h-8 rounded-full flex items-center justify-center text-sm">✕</button>
      </div>
      <div id="cartItems" class="overflow-y-auto flex-1 space-y-2.5 text-xs pl-1"></div>
      <div class="border-t border-gray-800 pt-3 mt-3 space-y-2.5">
        <div class="flex justify-between font-extrabold text-xs sm:text-sm">
          <span>الإجمالي الكلي:</span>
          <span id="cartTotal" class="text-yellow-400">$0</span>
        </div>
        <input id="buyerName" class="w-full bg-black border border-gray-700 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none" placeholder="اسم التاجر / المحل والمدينة..." />
        <button onclick="sendOrderWhatsApp()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-black py-3 rounded-xl text-xs sm:text-sm flex items-center justify-center gap-1.5 shadow-lg">
          <span>📲 إرسال الطلبية عبر واتساب (0996311804)</span>
        </button>
      </div>
    </div>
  </div>

  <!-- ربط Firebase للتحقق من الأدمن وإخفاء الزر عن الزبائن -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAa38Mjq8zFcpKNnJU7REheK_2qQ_GoXs4",
      authDomain: "najdt656-c4fe4.firebaseapp.com",
      projectId: "najdt656-c4fe4",
      storageBucket: "najdt656-c4fe4.firebasestorage.app",
      messagingSenderId: "229855614581",
      appId: "1:229855614581:web:e7429bb63e43fc5990ca3c"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    onAuthStateChanged(auth, (user) => {
      window.isAdminLoggedIn = !!user;
      const adminBar = document.getElementById('adminBar');
      if (user) {
        adminBar.classList.remove('hidden');
      } else {
        adminBar.classList.add('hidden');
      }
      renderProducts();
    });

    window.logoutAdminFirebase = function() {
      signOut(auth).then(() => {
        alert("تم تسجيل خروج الأدمن بأمان.");
        window.location.reload();
      });
    };
  </script>

  <script>
    let products = JSON.parse(localStorage.getItem('fw_cloud_products_db') || JSON.stringify([
      { id: 101, name: "طقم نسواني رسمي كتان ملكي #101", category: "نسواني", priceUsd: 12, minQty: 10, pack: "قياسات (M-L-XL-2XL)", views: 15, likes: 4, ratingSum: 18, ratingCount: 4, comments: [{id: 1, author: "محل النور", text: "قماش ممتاز"}], img: "https://images.unsplash.com/photo-1539109136881-3be0616acf4b?auto=format&fit=crop&w=600&q=80" }
    ]));
    let exchangeRate = 15000;
    let currencyMode = 'BOTH';
    let currentCategory = 'ALL';
    let searchQuery = '';
    let cart = [];
    let currentModalProduct = null;
    let isDarkMode = true;

    function showToast(message, type = 'success') {
      const container = document.getElementById('toastContainer');
      const toast = document.createElement('div');
      toast.className = `px-4 py-3 rounded-2xl shadow-2xl text-xs font-extrabold border flex items-center gap-2 ${type === 'success' ? 'bg-neutral-900 text-yellow-300 border-yellow-500' : 'bg-neutral-900 text-red-400 border-red-500'}`;
      toast.innerHTML = `<span>${type === 'success' ? '✨' : '⚠️'}</span><span>${message}</span>`;
      container.appendChild(toast);
      setTimeout(() => toast.remove(), 3000);
    }

    function toggleThemeMode() {
      const root = document.getElementById('htmlRoot') || document.documentElement;
      const body = document.getElementById('mainBody');
      const btn = document.getElementById('themeToggleBtn');
      if (isDarkMode) {
        body.className = "min-h-screen flex flex-col pb-20 md:pb-0 light-mode";
        btn.innerText = "☀️ نهاري";
        isDarkMode = false;
      } else {
        body.className = "min-h-screen flex flex-col pb-20 md:pb-0 dark-mode";
        btn.innerText = "🌙 ليلي";
        isDarkMode = true;
      }
    }

    function formatPrice(usd) {
      const numUsd = Math.round((Number(usd) || 0) * 100) / 100;
      const syp = Math.round(numUsd * exchangeRate).toLocaleString('en-US');
      if (currencyMode === 'USD') return `<span class="text-yellow-400 font-black text-sm">$${numUsd}</span>`;
      if (currencyMode === 'SYP') return `<span class="text-emerald-400 font-black text-xs">${syp} ل.س</span>`;
      return `<div class="flex flex-col"><span class="text-yellow-400 font-black text-sm">$${numUsd}</span><span class="text-emerald-400 font-bold text-[10px]">${syp} ل.س</span></div>`;
    }

    function renderProducts() {
      const grid = document.getElementById('productsGrid');
      if (!grid) return;
      let list = currentCategory === 'ALL' ? products : products.filter(p => p.category === currentCategory);
      if (searchQuery) list = list.filter(p => p.name.toLowerCase().includes(searchQuery));

      grid.innerHTML = list.map(p => {
        const avg = p.ratingCount ? (p.ratingSum / p.ratingCount).toFixed(1) : '5.0';
        return `
        <div class="card-luxury rounded-2xl overflow-hidden flex flex-col cursor-pointer" onclick="openProductModal(${p.id})">
          <div class="relative h-52 bg-neutral-900">
            <img src="${p.img}" class="w-full h-full object-cover" />
            <span class="absolute top-2.5 right-2.5 gold-gradient-bg text-black text-[10px] font-extrabold px-2.5 py-0.5 rounded-full">${p.category}</span>
          </div>
          <div class="p-3 flex-1 flex flex-col justify-between space-y-2">
            <h3 class="font-extrabold text-xs line-clamp-1">${p.name}</h3>
            <div class="flex items-center justify-between text-[10px] text-gray-400">
              <span>👁️ ${p.views || 0}</span>
              <span class="text-yellow-400 font-bold">⭐ ${avg}</span>
              <span>❤️ ${p.likes || 0}</span>
            </div>
            <div class="flex items-center justify-between border-t border-gray-800 pt-2">
              ${formatPrice(p.priceUsd)}
              <span class="text-emerald-400 font-bold text-[10px]">📦 أدنى: 10</span>
            </div>
            ${window.isAdminLoggedIn ? `
              <div class="flex gap-1 pt-1 border-t border-gray-800">
                <button onclick="event.stopPropagation(); editProduct(${p.id})" class="flex-1 bg-blue-600 text-white text-[10px] py-1 rounded-lg">تعديل ✏️</button>
                <button onclick="event.stopPropagation(); deleteProduct(${p.id})" class="flex-1 bg-red-600 text-white text-[10px] py-1 rounded-lg">حذف 🗑️</button>
              </div>
            ` : ''}
          </div>
        </div>
      `;
      }).join('');
    }

    function openProductModal(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;
      currentModalProduct = p;
      p.views = (p.views || 0) + 1;
      saveToStorage();

      document.getElementById('modalTitle').innerText = p.name;
      document.getElementById('modalMainImg').src = p.img;
      document.getElementById('modalViews').innerText = `👁️ ${p.views} مشاهدة`;
      document.getElementById('modalLikeBtn').innerText = `❤️ إعجاب (${p.likes || 0})`;
      document.getElementById('modalPack').innerText = `📐 التفاصيل: ${p.pack || 'قياسات قياسية'}`;
      document.getElementById('modalPriceContainer').innerHTML = formatPrice(p.priceUsd);
      document.getElementById('modalQtyInput').value = p.minQty || 10;
      document.getElementById('modalMinNotice').innerText = `الحد الأدنى: ${p.minQty || 10} قطع`;

      renderStars(p);
      renderComments(p);

      document.getElementById('productModal').classList.add('flex');
      document.getElementById('productModal').classList.remove('hidden');
    }

    function closeProductModal() {
      document.getElementById('productModal').classList.add('hidden');
      document.getElementById('productModal').classList.remove('flex');
      renderProducts();
    }

    function toggleLikeCurrent() {
      if (!currentModalProduct) return;
      currentModalProduct.likes = (currentModalProduct.likes || 0) + 1;
      document.getElementById('modalLikeBtn').innerText = `❤️ إعجاب (${currentModalProduct.likes})`;
      saveToStorage();
      showToast("شكراً لإعجابك بالموديل! ❤️");
    }

    function renderStars(p) {
      const container = document.getElementById('modalStarsContainer');
      let html = '';
      for (let i = 1; i <= 5; i++) {
        html += `<span onclick="rateProduct(${p.id}, ${i})" class="text-yellow-400 hover:scale-125 transition cursor-pointer">★</span>`;
      }
      container.innerHTML = html;
    }

    function rateProduct(id, stars) {
      const p = products.find(item => item.id === id);
      if (!p) return;
      p.ratingSum = (p.ratingSum || 20) + stars;
      p.ratingCount = (p.ratingCount || 4) + 1;
      saveToStorage();
      showToast(`تم تسجيل تقييمك (${stars} نجوم) بنجاح ⭐`);
    }

    function renderComments(p) {
      const list = document.getElementById('commentsList');
      const comments = p.comments || [];
      if (comments.length === 0) {
        list.innerHTML = `<p class="text-gray-500 text-[11px]">لا توجد تعليقات بعد.</p>`;
        return;
      }
      list.innerHTML = comments.map(c => `
        <div class="flex justify-between items-center bg-black/60 p-2 rounded-xl border border-gray-800">
          <div>
            <span class="text-yellow-400 font-bold">${c.author}:</span>
            <span class="text-gray-200 mr-1">${c.text}</span>
          </div>
          ${window.isAdminLoggedIn ? `<button onclick="deleteComment(${p.id},${c.id})" class="text-red-400 font-bold text-[10px]">حذف 🗑️</button>` : ''}
        </div>
      `).join('');
    }

    function addComment() {
      if (!currentModalProduct) return;
      const author = document.getElementById('commentAuthor').value.trim() || "تاجر";
      const text = document.getElementById('commentText').value.trim();
      if (!text) return alert("اكتب تعليقاً أولاً!");

      if (!currentModalProduct.comments) currentModalProduct.comments = [];
      currentModalProduct.comments.push({ id: Date.now(), author, text });
      document.getElementById('commentText').value = "";
      saveToStorage();
      renderComments(currentModalProduct);
      showToast("تم نشر تعليقك بنجاح 💬");
    }

    function deleteComment(prodId, commentId) {
      const p = products.find(item => item.id === prodId);
      if (!p) return;
      p.comments = p.comments.filter(c => c.id !== commentId);
      saveToStorage();
      renderComments(p);
      showToast("تم حذف التعليق بنجاح", "error");
    }

    function adjustModalQty(delta) {
      const input = document.getElementById('modalQtyInput');
      let val = (parseInt(input.value) || 10) + delta;
      if (val < 10) val = 10;
      input.value = val;
    }

    function addCustomQtyToCart() {
      if (!currentModalProduct) return;
      const qty = parseInt(document.getElementById('modalQtyInput').value) || 10;
      cart.push({ ...currentModalProduct, qty });
      document.getElementById('cartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);
      document.getElementById('mobileCartCount').innerText = cart.reduce((a,b)=>a+b.qty,0);
      closeProductModal();
      showToast("تمت إضافة الموديل إلى السلة 🛒");
    }

    function saveToStorage() {
      localStorage.setItem('fw_cloud_products_db', JSON.stringify(products));
    }

    function filterCategory(cat) { currentCategory = cat; renderProducts(); }
    function setCurrencyMode(m) { currencyMode = m; renderProducts(); }
    function handleSearch(q) { searchQuery = q.trim().toLowerCase(); renderProducts(); }
    function clearSearch() { document.getElementById('searchInput').value = ''; handleSearch(''); }

    function openAddModal() {
      document.getElementById('editProductId').value = "";
      document.getElementById('addModalTitle').innerText = "➕ نشر موديل جديد";
      document.getElementById('pName').value = "";
      document.getElementById('pPrice').value = "";
      document.getElementById('addModal').classList.add('flex');
      document.getElementById('addModal').classList.remove('hidden');
    }
    function closeAddModal() {
      document.getElementById('addModal').classList.add('hidden');
      document.getElementById('addModal').classList.remove('flex');
    }

    function editProduct(id) {
      const p = products.find(item => item.id === id);
      if (!p) return;
      document.getElementById('editProductId').value = p.id;
      document.getElementById('addModalTitle').innerText = "✏️ تعديل بيانات الموديل";
      document.getElementById('pName').value = p.name;
      document.getElementById('pCat').value = p.category;
      document.getElementById('pPrice').value = p.priceUsd;
      document.getElementById('addModal').classList.add('flex');
      document.getElementById('addModal').classList.remove('hidden');
    }

    async function saveNewProduct(e) {
      e.preventDefault();
      const editId = document.getElementById('editProductId').value;
      const name = document.getElementById('pName').value.trim();
      const category = document.getElementById('pCat').value;
      const priceUsd = parseFloat(document.getElementById('pPrice').value) || 12;
      const fileInput = document.getElementById('pImgFile');

      let imgData = "https://images.unsplash.com/photo-1445205170230-053b83016050?auto=format&fit=crop&w=600&q=80";
      if (fileInput.files && fileInput.files[0]) {
        const reader = new FileReader();
        reader.readAsDataURL(fileInput.files[0]);
        await new Promise(r => reader.onload = r);
        imgData = reader.result;
      }

      if (editId) {
        const p = products.find(item => item.id == editId);
        if (p) {
          p.name = name; p.category = category; p.priceUsd = priceUsd;
          if (fileInput.files && fileInput.files[0]) p.img = imgData;
        }
      } else {
        products.unshift({ id: Date.now(), name, category, priceUsd, minQty: 10, pack: "قياسات قياسية", views: 1, likes: 0, ratingSum: 20, ratingCount: 4, comments: [], img: imgData });
      }

      saveToStorage();
      closeAddModal();
      renderProducts();
      showToast("تم الحفظ بنجاح لجميع الزبائن! ✨");
    }

    function deleteProduct(id) {
      if (confirm("هل أنت متأكد من حذف هذا الموديل؟")) {
        products = products.filter(p => p.id !== id);
        saveToStorage();
        renderProducts();
        showToast("تم الحذف بنجاح", "error");
      }
    }

    function openCart() {
      const container = document.getElementById('cartItems');
      if (cart.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-500 py-6">السلة فارغة حالياً</p>`;
        document.getElementById('cartTotal').innerText = "$0";
      } else {
        let total = 0;
        container.innerHTML = cart.map(c => {
          let sub = c.priceUsd * c.qty; total += sub;
          return `<div class="flex justify-between items-center bg-black/60 p-2.5 rounded-xl border border-gray-800">
            <div><p class="font-bold text-white">${c.name}</p><p class="text-[10px] text-yellow-400">$${c.priceUsd} × ${c.qty}</p></div>
            <span class="text-emerald-400 font-bold">$${sub}</span>
          </div>`;
        }).join('');
        document.getElementById('cartTotal').innerText = `$${total}`;
      }
      document.getElementById('cartModal').classList.add('flex');
      document.getElementById('cartModal').classList.remove('hidden');
    }
    function closeCart() {
      document.getElementById('cartModal').classList.add('hidden');
      document.getElementById('cartModal').classList.remove('flex');
    }
    function sendOrderWhatsApp() {
      if (cart.length === 0) return alert("السلة فارغة!");
      const buyer = document.getElementById('buyerName').value || "تاجر جملة";
      let total = 0;
      let lines = cart.map((c, i) => { let sub = c.priceUsd * c.qty; total += sub; return `${i+1}. ${c.name} | الكمية: ${c.qty} | الإجمالي: $${sub}`; }).join('%0A');
      window.open(`https://wa.me/963996311804?text=طلبية جملة من: ${buyer}%0A--------------------%0A${lines}%0A--------------------%0Aالمجموع: $${total}`, '_blank');
    }

    renderProducts();
  </script>
</body>
</html>
