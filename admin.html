<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>لوحة التحكم | FASHION WORLD</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Cairo', sans-serif; background-color: #060606; color: #f5f5f5; margin: 0; padding: 0; }
    .glass-panel { background: rgba(16, 16, 16, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.22); }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">
  
  <div id="loginBox" class="glass-panel max-w-sm w-full p-6 rounded-3xl shadow-2xl space-y-4 text-center">
    <h2 class="text-lg font-black text-yellow-400">🔐 تسجيل دخول الإدارة</h2>
    <p class="text-xs text-gray-400">أدخل كلمة المرور الخاصة بلوحة التحكم:</p>
    <input id="adminPassInput" type="password" class="w-full bg-black border border-gray-700 rounded-xl px-3 py-2 text-white text-center text-sm focus:outline-none focus:border-yellow-500" placeholder="كلمة المرور" />
    <button onclick="checkAdminLogin()" class="w-full bg-yellow-400 hover:bg-yellow-300 text-black font-black py-2.5 rounded-xl text-xs shadow">دخول 👑</button>
    <a href="index.html" class="block text-gray-400 text-xs hover:text-white pt-2">العودة للمتجر الرئيسي 🏠</a>
  </div>

  <div id="adminPanelBox" class="hidden glass-panel max-w-xl w-full p-6 rounded-3xl shadow-2xl space-y-4 text-xs">
    <div class="flex justify-between items-center border-b border-gray-800 pb-3">
      <h2 class="text-sm font-extrabold text-yellow-400">👑 لوحة التحكم والإدارة الرئيسية</h2>
      <button onclick="logoutAdmin()" class="bg-red-600 text-white px-3 py-1.5 rounded-xl font-bold">تسجيل خروج 🔒</button>
    </div>
    <div class="space-y-3">
      <div class="bg-black/50 p-3 rounded-2xl border border-gray-800 space-y-2">
        <p class="font-bold text-yellow-300">⚙️ إعدادات المتجر العامة:</p>
        <button onclick="changeExchangeRate()" class="w-full bg-neutral-800 hover:bg-neutral-700 text-yellow-400 font-bold py-2.5 rounded-xl">💱 تعديل سعر الصرف الحالي</button>
        <button onclick="exportSiteCode()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-2.5 rounded-xl">☁️ حفظ وتحديث البيانات للزبائن</button>
      </div>
      <div class="bg-black/50 p-3 rounded-2xl border border-gray-800 space-y-2">
        <p class="font-bold text-yellow-300">📦 إدارة الموديلات:</p>
        <a href="index.html" class="block text-center gold-gradient-bg text-black font-extrabold py-2.5 rounded-xl">➕ إضافة موديل جديد من الواجهة الرئيسية</a>
      </div>
    </div>
    <div class="text-center pt-2">
      <a href="index.html" class="text-gray-400 hover:text-white text-xs">الذهاب إلى عرض المتجر 🛍️</a>
    </div>
  </div>

  <script>
    function checkAdminLogin() {
      const pass = document.getElementById('adminPassInput').value.trim();
      if (pass === "Dane7422") {
        localStorage.setItem('fw_admin_logged_master', '1');
        showAdminPanel();
      } else {
        alert("كلمة المرور غير صحيحة!");
      }
    }
    function showAdminPanel() {
      document.getElementById('loginBox').classList.add('hidden');
      document.getElementById('adminPanelBox').classList.remove('hidden');
    }
    function logoutAdmin() {
      localStorage.removeItem('fw_admin_logged_master');
      document.getElementById('adminPanelBox').classList.add('hidden');
      document.getElementById('loginBox').classList.remove('hidden');
    }
    function changeExchangeRate() {
      const val = prompt("أدخل سعر صرف الدولار الجديد:", "15000");
      if (val) alert("تم تحديث سعر الصرف بنجاح!");
    }
    function exportSiteCode() {
      alert("تم رفع وحفظ كافة التحديثات بنجاح للسحابة!");
    }
    if (localStorage.getItem('fw_admin_logged_master') === '1') {
      showAdminPanel();
    }
  </script>
</body>
</html>
