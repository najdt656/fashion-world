<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل دخول الأدمن الآمن | FASHION WORLD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #060606; color: #f5f5f5; margin: 0; padding: 0; }
        .glass-panel { background: rgba(16, 16, 16, 0.85); backdrop-filter: blur(16px); border: 1px solid rgba(212, 175, 55, 0.22); }
        .gold-gradient-bg { background: linear-gradient(135deg, #F3D77D 0%, #D4AF37 50%, #9A6F1A 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- صندوق تسجيل الدخول عبر Firebase -->
    <div id="login-box" class="glass-panel max-w-sm w-full p-6 sm:p-8 rounded-3xl shadow-2xl space-y-4 text-center">
        <div class="w-14 h-14 mx-auto rounded-2xl bg-yellow-500/10 border border-yellow-500/30 flex items-center justify-center text-2xl">
            🛡️
        </div>
        <h2 class="text-base font-black text-yellow-400">لوحة التحكم الآمنة - Fashion World</h2>
        <p class="text-xs text-gray-400">أدخل بيانات الاعتماد الخاصة بإدارة المتجر:</p>
        
        <form id="login-form" class="space-y-3">
            <input type="email" id="email" placeholder="البريد الإلكتروني للإدارة" required class="w-full bg-black border border-gray-700 rounded-xl px-3 py-2.5 text-white text-xs text-center focus:border-yellow-500 focus:outline-none">
            <input type="password" id="password" placeholder="كلمة المرور" required class="w-full bg-black border border-gray-700 rounded-xl px-3 py-2.5 text-white text-xs text-center focus:border-yellow-500 focus:outline-none">
            <button type="submit" class="w-full gold-gradient-bg text-black font-black py-3 rounded-xl text-xs shadow-lg transition hover:opacity-95">دخول آمن 👑</button>
        </form>
        <div id="error-msg" class="text-red-400 text-xs font-bold pt-1"></div>
        <a href="index.html" class="block text-gray-400 text-xs hover:text-white pt-2 underline">العودة للمتجر الرئيسي 🏠</a>
    </div>

    <!-- لوحة التحكم الفعلية (تظهر بعد نجاح تسجيل الدخول) -->
    <div id="adminPanelBox" class="hidden glass-panel max-w-xl w-full p-6 rounded-3xl shadow-2xl space-y-4 text-xs">
        <div class="flex justify-between items-center border-b border-gray-800 pb-3">
            <div class="flex items-center gap-2">
                <span class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></span>
                <h2 class="text-sm font-extrabold text-yellow-400">لوحة التحكم النشطة - FASHION WORLD</h2>
            </div>
            <button onclick="logoutAdmin()" class="bg-red-600 hover:bg-red-500 text-white px-3 py-1.5 rounded-xl font-bold transition">قفل الجلسة 🔒</button>
        </div>

        <div class="space-y-3">
            <div class="bg-black/50 p-3.5 rounded-2xl border border-gray-800 space-y-2.5">
                <p class="font-bold text-yellow-300">⚙️ الإعدادات السريعة:</p>
                <button onclick="changeExchangeRate()" class="w-full bg-neutral-800 hover:bg-neutral-700 text-yellow-400 font-bold py-2.5 rounded-xl transition">💱 تعديل سعر الصرف الحالي</button>
                <button onclick="exportSiteCode()" class="w-full bg-emerald-500 hover:bg-emerald-400 text-black font-extrabold py-2.5 rounded-xl transition">☁️ حفظ وتحديث البيانات للزبائن</button>
            </div>

            <div class="bg-black/50 p-3.5 rounded-2xl border border-gray-800 space-y-2.5">
                <p class="font-bold text-yellow-300">📦 إدارة الكتالوج:</p>
                <a href="index.html" class="block text-center gold-gradient-bg text-black font-black py-2.5 rounded-xl shadow transition">➕ إضافة موديل جديد من الواجهة الرئيسية</a>
            </div>
        </div>

        <div class="text-center pt-2">
            <a href="index.html" class="text-gray-400 hover:text-white text-xs underline">الذهاب إلى عرض المتجر 🛍️</a>
        </div>
    </div>

    <!-- كود ربط Firebase والتحقق من تسجيل الدخول -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

        const firebaseConfig = {
          apiKey: "AIzaSyAa38Mjq8zFcpKNnJU7REheK_2qQ_GoXs4",
          authDomain: "najdt656-c4fe4.firebaseapp.com",
          projectId: "najdt656-c4fe4",
          storageBucket: "najdt656-c4fe4.firebasestorage.app",
          messagingSenderId: "229855614581",
          appId: "1:229855614581:web:e7429bb63e43fc5990ca3c",
          measurementId: "G-ET6JMFJ9H1"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        const loginForm = document.getElementById('login-form');
        const errorMsg = document.getElementById('error-msg');
        const loginBox = document.getElementById('login-box');
        const adminPanelBox = document.getElementById('adminPanelBox');

        // التحقق مما إذا كان المستخدم مسجلاً مسبقاً في هذه الجلسة
        onAuthStateChanged(auth, (user) => {
            if (user) {
                loginBox.classList.add('hidden');
                adminPanelBox.classList.remove('hidden');
                localStorage.setItem('fw_admin_logged_master', '1');
            }
        });

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            errorMsg.textContent = "جاري التحقق عبر خوادم جوجل... ⏳";

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    errorMsg.textContent = "";
                    loginBox.classList.add('hidden');
                    adminPanelBox.classList.remove('hidden');
                    localStorage.setItem('fw_admin_logged_master', '1');
                })
                .catch((error) => {
                    errorMsg.textContent = "خطأ في البريد الإلكتروني أو كلمة المرور!";
                });
        });

        window.logoutAdmin = function() {
            signOut(auth).then(() => {
                localStorage.removeItem('fw_admin_logged_master');
                adminPanelBox.classList.add('hidden');
                loginBox.classList.remove('hidden');
            });
        };
    </script>

    <script>
        function changeExchangeRate() {
            const val = prompt("أدخل سعر صرف الدولار الجديد:", "15000");
            if (val) alert("تم تحديث سعر الصرف بنجاح!");
        }
        function exportSiteCode() {
            alert("تم رفع وحفظ كافة التحديثات بنجاح للسحابة!");
        }
    </script>

</body>
</html>
